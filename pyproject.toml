[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structured-output-crashlab"
version = "0.1.0"
description = "Offline structured-output conformance runner: classify raw model-like outputs against a JSON Schema."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Justin Wilson", email = "jammin411@gmail.com" }]
keywords = ["json-schema", "structured-output", "conformance", "fixtures", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
crashlab = "crashlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
